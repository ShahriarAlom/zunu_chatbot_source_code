version: '3.8'

services:
  # The MariaDB Vector Database for the Chatbot
  mariadb_chatbot:
    image: mariadb:latest
    container_name: rdr_mariadb_vector
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: realdealride_ai
    ports:
      - "3307:3306" # Mapped to 3307 on host so it doesn't conflict with your main Laravel DB
    volumes:
      - rdr_ai_data:/var/lib/mysql
      # This automatically runs our init script on the first startup!
      - ./requirements/init-mariadb.sql:/docker-entrypoint-initdb.d/init-mariadb.sql

  # The FastAPI Backend
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: rdr_fastapi_backend
    restart: unless-stopped
    ports:
      - "8085:8000"
    environment:
      - MARIADB_URI=mysql+aiomysql://root:password@mariadb_chatbot:3306/realdealride_ai
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./requirements/knowledge_Base_doc:/app/knowledge_Base_doc
    depends_on:
      - mariadb_chatbot

  # The FastAPI Backend (UAT Environment)
  backend_uat:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: rdr_fastapi_backend_uat
    restart: unless-stopped
    ports:
      - "8086:8000"
    env_file:
      - ./backend/.env.uat
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./requirements/knowledge_Base_doc:/app/knowledge_Base_doc
    depends_on:
      - mariadb_chatbot

volumes:
  rdr_ai_data:
